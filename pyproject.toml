[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "slidecold"
dynamic = ["version"]
description = "Official Python SDK, CLI and MCP server for the SlideCold API (Instagram cold-DM outreach)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SlideCold" }]
keywords = ["slidecold", "instagram", "cold-dm", "outreach", "sdk", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
# The MCP SDK 2.x requires Python 3.10+; on 3.9 the extra installs nothing and slidecold-mcp explains why.
mcp = ["mcp>=2.1,<3; python_version >= '3.10'"]

[project.scripts]
slidecold = "slidecold.cli:main"
slidecold-mcp = "slidecold.mcp_server:main"

[project.urls]
Homepage = "https://slidecold.com"
Documentation = "https://slidecold.com/docs"
Repository = "https://github.com/slidecold/slidecold-python"
Changelog = "https://github.com/slidecold/slidecold-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "anyio>=4",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/slidecold/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slidecold"]

[tool.hatch.build.targets.sdist]
include = ["src/slidecold", "scripts/generate.py", "openapi.yaml", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: line length is the formatter's job. UP*: keep typing.List/Optional, 3.9 evaluates annotations.
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.format]
exclude = ["src/slidecold/_operations.py", "src/slidecold/_resources.py", "src/slidecold/types.py"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/slidecold"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
